spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      validation-timeout: 5000

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.mapvendor: INFO
