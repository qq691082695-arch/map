server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: map-vendor-backend
  datasource:
    url: ${MAP_VENDOR_DB_URL:jdbc:mysql://127.0.0.1:3306/map_vendor?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MAP_VENDOR_DB_USERNAME:map_vendor_app}
    password: ${MAP_VENDOR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    user: ${MAP_VENDOR_FLYWAY_USERNAME:map_vendor_flyway}
    password: ${MAP_VENDOR_FLYWAY_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

map-vendor:
  timezone: Asia/Shanghai
  storage:
    root: ${MAP_VENDOR_STORAGE_ROOT:D:/Map-Vendor-Data/images}
    public-base-url: ${MAP_VENDOR_PUBLIC_BASE_URL:/files}
    max-file-size-bytes: 10485760
    minimum-free-bytes: ${MAP_VENDOR_STORAGE_MINIMUM_FREE_BYTES:5368709120}
  cors:
    allowed-origins: ${MAP_VENDOR_CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.mapvendor: INFO
