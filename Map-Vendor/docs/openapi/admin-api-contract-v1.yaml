openapi: 3.0.3
info:
  title: Map Vendor Admin API
  version: v1
  description: 管理端登录由前端完成，后端不认证；/api/v1/admin/** 必须由 Nginx 网络边界、HTTPS、限流和审计保护。
paths:
  /api/v1/admin/files/images:
    post:
      summary: 上传 JPEG、PNG 或 WebP 图片到服务器本地存储
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ImageResourceResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/universities:
    get:
      summary: 分页查询高校
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/UniversityStatus'}}
      responses:
        '200':
          description: 成功
          content: {application/json: {schema: {$ref: '#/components/schemas/UniversityPageResponse'}}}
    post:
      summary: 新增高校
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UniversitySaveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/UniversityResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/universities/{id}:
    parameters: [{$ref: '#/components/parameters/UniversityId'}]
    get:
      summary: 查询高校详情
      responses:
        '200': {$ref: '#/components/responses/UniversityResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 编辑高校并整体替换图片关联
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UniversitySaveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/UniversityResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 逻辑删除高校
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: 成功
          content: {application/json: {schema: {$ref: '#/components/schemas/EmptyResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/universities/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/UniversityId'}
      - {$ref: '#/components/parameters/RequestId'}
    patch:
      summary: 启用或禁用高校
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: {status: {$ref: '#/components/schemas/UniversityStatus'}}
      responses:
        '200': {$ref: '#/components/responses/UniversityResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/businesses:
    get:
      summary: 分页查询服务商
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: keyword, in: query, description: 匹配名称或地址, schema: {type: string}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/BusinessType'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/BusinessStatus'}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessPageResponse'}}}}
    post:
      summary: 新增服务商（服务商不是账号或系统角色）
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessSaveRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/BusinessResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/businesses/{id}:
    parameters: [{$ref: '#/components/parameters/BusinessId'}]
    get:
      summary: 查询服务商详情
      responses:
        '200': {$ref: '#/components/responses/BusinessResponse'}
        '404': {$ref: '#/components/responses/BusinessNotFound'}
    put:
      summary: 编辑服务商（businessType 不可修改）
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessSaveRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/BusinessResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/BusinessNotFound'}
    delete:
      summary: 逻辑删除服务商，保留历史订单引用与快照
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyResponse'}}}}
        '404': {$ref: '#/components/responses/BusinessNotFound'}
  /api/v1/admin/businesses/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/BusinessId'}
      - {$ref: '#/components/parameters/RequestId'}
    patch:
      summary: 启用或禁用服务商
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status], properties: {status: {$ref: '#/components/schemas/BusinessStatus'}}}}}
      responses:
        '200': {$ref: '#/components/responses/BusinessResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/BusinessNotFound'}
  /api/v1/admin/businesses/{businessId}/cars:
    get: {summary: 分页查询车辆, responses: {'200': {description: 成功}}}
    post: {summary: 新增车辆, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CarSaveRequest'}}}}, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/cars/{id}:
    get: {summary: 查询车辆详情, responses: {'200': {description: 成功}}}
    put: {summary: 编辑车辆, responses: {'200': {description: 成功}}}
    delete: {summary: 逻辑删除车辆, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/cars/{id}/status:
    patch: {summary: 启停车辆, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/rooms:
    get: {summary: 分页查询房型, responses: {'200': {description: 成功}}}
    post: {summary: 新增房型, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSaveRequest'}}}}, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/rooms/{id}:
    get: {summary: 查询房型详情, responses: {'200': {description: 成功}}}
    put: {summary: 编辑房型, responses: {'200': {description: 成功}}}
    delete: {summary: 逻辑删除房型, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/rooms/{id}/status:
    patch: {summary: 启停房型, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/dishes:
    get: {summary: 分页查询菜品, responses: {'200': {description: 成功}}}
    post: {summary: 新增菜品, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DishSaveRequest'}}}}, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/dishes/{id}:
    get: {summary: 查询菜品详情, responses: {'200': {description: 成功}}}
    put: {summary: 编辑菜品, responses: {'200': {description: 成功}}}
    delete: {summary: 逻辑删除菜品, responses: {'200': {description: 成功}}}
  /api/v1/admin/businesses/{businessId}/dishes/{id}/status:
    patch: {summary: 启停菜品, responses: {'200': {description: 成功}}}
  /api/v1/admin/orders:
    get:
      summary: 分页筛选全部订单（按创建时间和 ID 倒序稳定排序）
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: serviceDateFrom, in: query, schema: {type: string, format: date}}
        - {name: serviceDateTo, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/BusinessType'}}
        - {name: businessId, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrderPageResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{id}:
    get:
      summary: 查询订单详情（展示订单历史快照）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrderDetailResponse'}}}}
        '404': {description: 订单不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/admin/orders/export:
    get:
      summary: 按订单列表筛选条件流式导出 Excel
      description: serviceDateFrom/serviceDateTo 均必填且包含边界；默认最大 366 天、10000 行。导出包含完整手机号并写审计日志，不包含 openid。
      parameters:
        - {name: serviceDateFrom, in: query, required: true, schema: {type: string, format: date}}
        - {name: serviceDateTo, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/BusinessType'}}
        - {name: businessId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: XLSX 文件
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{id}/confirm:
    post:
      summary: 管理员确认待确认订单
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrderDetailResponse'}}}}
        '404': {description: 订单不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {$ref: '#/components/responses/OrderStatusConflict'}
  /api/v1/admin/orders/{id}/cancel:
    post:
      summary: 管理员取消待确认订单
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/RequestId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrderCancelRequest'}}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrderDetailResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {description: 订单不存在, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {$ref: '#/components/responses/OrderStatusConflict'}
  /api/v1/admin/statistics/overview:
    get:
      summary: 按服务日期、服务商和类型统计三种订单状态
      description: 日期为 Asia/Shanghai 业务自然日且起止边界均包含；服务商名称使用订单历史快照。
      parameters:
        - {name: serviceDateFrom, in: query, schema: {type: string, format: date}}
        - {name: serviceDateTo, in: query, schema: {type: string, format: date}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/BusinessType'}}
        - {name: businessId, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminStatisticsOverviewResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
components:
  parameters:
    UniversityId: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    BusinessId: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    RequestId: {name: X-Request-Id, in: header, required: false, schema: {type: string, maxLength: 64}}
  schemas:
    UniversityStatus: {type: string, enum: [ENABLED, DISABLED]}
    BusinessType: {type: string, enum: [TRAVEL, HOTEL, FOOD]}
    BusinessStatus: {type: string, enum: [ENABLED, DISABLED]}
    ResourceStatus: {type: string, enum: [ENABLED, DISABLED]}
    OrderStatus: {type: string, enum: [PENDING, CONFIRMED, CANCELLED]}
    StatusCounts:
      type: object
      required: [pendingCount, confirmedCount, cancelledCount, totalCount]
      properties:
        pendingCount: {type: integer, format: int64}
        confirmedCount: {type: integer, format: int64}
        cancelledCount: {type: integer, format: int64}
        totalCount: {type: integer, format: int64}
    BusinessStatistics:
      allOf:
        - {$ref: '#/components/schemas/StatusCounts'}
        - type: object
          required: [businessId, businessNameSnapshot, businessType]
          properties:
            businessId: {type: integer, format: int64}
            businessNameSnapshot: {type: string}
            businessType: {$ref: '#/components/schemas/BusinessType'}
    AdminStatisticsOverviewResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code: {type: string, example: OK}
        message: {type: string, example: success}
        requestId: {type: string, nullable: true}
        data:
          type: object
          required: [total, businesses]
          properties:
            serviceDateFrom: {type: string, format: date, nullable: true}
            serviceDateTo: {type: string, format: date, nullable: true}
            total: {$ref: '#/components/schemas/StatusCounts'}
            businesses: {type: array, items: {$ref: '#/components/schemas/BusinessStatistics'}}
    AdminOrderCancelRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 500}}
    CarSaveRequest:
      type: object
      required: [model, seatNum]
      properties: {model: {type: string, maxLength: 128}, seatNum: {type: integer, minimum: 1}, description: {type: string, maxLength: 500, nullable: true}, imageResourceId: {type: integer, format: int64, nullable: true}}
    RoomSaveRequest:
      type: object
      required: [name, bedSpec]
      properties: {name: {type: string, maxLength: 128}, bedSpec: {type: string, maxLength: 128}, description: {type: string, maxLength: 500, nullable: true}, imageResourceId: {type: integer, format: int64, nullable: true}}
    DishSaveRequest:
      type: object
      required: [name, sortNo]
      properties: {name: {type: string, maxLength: 128}, description: {type: string, maxLength: 500, nullable: true}, imageResourceId: {type: integer, format: int64, nullable: true}, sortNo: {type: integer, minimum: 0}}
    BusinessSaveRequest:
      type: object
      required: [name, address, longitude, latitude, businessType]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        address: {type: string, minLength: 1, maxLength: 255}
        longitude: {type: number, minimum: -180, maximum: 180}
        latitude: {type: number, minimum: -90, maximum: 90}
        businessType: {$ref: '#/components/schemas/BusinessType'}
        intro: {type: string, nullable: true}
        foodContactName: {type: string, maxLength: 64, nullable: true, description: 仅 FOOD}
        foodContactPhone: {type: string, maxLength: 32, nullable: true, description: 仅 FOOD}
        foodRecommendedDishes: {type: string, maxLength: 500, nullable: true, description: 仅 FOOD}
        imageResourceIds: {type: array, maxItems: 20, uniqueItems: true, items: {type: integer, format: int64}}
    Business:
      allOf:
        - {$ref: '#/components/schemas/BusinessSaveRequest'}
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: {type: integer, format: int64}
            status: {$ref: '#/components/schemas/BusinessStatus'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    UniversitySaveRequest:
      type: object
      required: [name, polygonPoints]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        intro: {type: string, nullable: true}
        polygonPoints: {type: array, minItems: 3, items: {$ref: '#/components/schemas/GeoPoint'}}
        imageResourceIds: {type: array, maxItems: 20, uniqueItems: true, items: {type: integer, format: int64}}
    UniversityImage:
      type: object
      required: [resourceId, url, sortNo]
      properties:
        resourceId: {type: integer, format: int64}
        url: {type: string}
        sortNo: {type: integer, minimum: 0}
    ImageResource:
      type: object
      required: [resourceId, url, mimeType, sizeBytes]
      properties:
        resourceId: {type: integer, format: int64}
        url: {type: string, example: /files/2026/08/random.webp}
        mimeType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        sizeBytes: {type: integer, format: int64, minimum: 1}
    ImageResourceResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/ImageResource'}}}
    University:
      type: object
      required: [id, name, polygonPoints, status, images, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        intro: {type: string, nullable: true}
        polygonPoints: {type: array, items: {$ref: '#/components/schemas/GeoPoint'}}
        status: {$ref: '#/components/schemas/UniversityStatus'}
        images: {type: array, items: {$ref: '#/components/schemas/UniversityImage'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        data: {nullable: true}
        requestId: {type: string}
    EmptyResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - {type: object, properties: {code: {example: OK}, message: {example: success}}}
    UniversityResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/University'}}}
    UniversityPageResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - type: object
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/University'}}
                total: {type: integer, format: int64}
                page: {type: integer}
                pageSize: {type: integer}
    BusinessResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/Business'}}}
    BusinessPageResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - type: object
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/Business'}}
                total: {type: integer, format: int64}
                page: {type: integer}
                pageSize: {type: integer}
    AdminOrderSummary:
      type: object
      required: [id, orderNo, openidMasked, businessId, businessNameSnapshot, serviceType, contactName, contactPhoneMasked, peopleNum, serviceDate, status, createdAt]
      properties:
        id: {type: integer, format: int64}
        orderNo: {type: string}
        openidMasked: {type: string, description: 脱敏 openid，列表和详情均不返回完整值}
        businessId: {type: integer, format: int64}
        businessNameSnapshot: {type: string, description: 下单时服务商名称快照}
        serviceType: {$ref: '#/components/schemas/BusinessType'}
        contactName: {type: string}
        contactPhoneMasked: {type: string, example: 138****5678}
        peopleNum: {type: integer, minimum: 1}
        serviceDate: {type: string, format: date}
        status: {$ref: '#/components/schemas/OrderStatus'}
        createdAt: {type: string, format: date-time}
    AdminOrderDetail:
      allOf:
        - {$ref: '#/components/schemas/AdminOrderSummary'}
        - type: object
          properties:
            contactPhone: {type: string, description: 仅管理员详情接口返回完整手机号；不得写入日志}
            businessType: {$ref: '#/components/schemas/BusinessType'}
            carId: {type: integer, format: int64, nullable: true}
            carSpecSnapshot: {type: string, nullable: true}
            carQuantity: {type: integer, nullable: true}
            serviceMode: {type: string, enum: [DAY_CHARTER, ROUND_TRIP], nullable: true}
            roomId: {type: integer, format: int64, nullable: true}
            roomSpecSnapshot: {type: string, nullable: true}
            roomQuantity: {type: integer, nullable: true}
            mealPeriod: {type: string, enum: [BREAKFAST, LUNCH, DINNER], nullable: true}
            optionSnapshotJson: {type: string, nullable: true, description: 只读历史展示补充快照，不承载筛选字段}
            confirmedAt: {type: string, format: date-time, nullable: true}
            cancelledAt: {type: string, format: date-time, nullable: true}
            cancelSource: {type: string, enum: [USER, ADMIN], nullable: true}
            cancelReason: {type: string, nullable: true}
            updatedAt: {type: string, format: date-time}
    AdminOrderPageResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - type: object
          properties:
            data:
              type: object
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AdminOrderSummary'}}
                total: {type: integer, format: int64}
                page: {type: integer}
                pageSize: {type: integer}
    AdminOrderDetailResponse:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/AdminOrderDetail'}}}
  responses:
    UniversityResponse:
      description: 成功
      content: {application/json: {schema: {$ref: '#/components/schemas/UniversityResponse'}}}
    BusinessResponse:
      description: 成功
      content: {application/json: {schema: {$ref: '#/components/schemas/BusinessResponse'}}}
    ValidationError:
      description: 参数或业务校验失败
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: 高校不存在或已逻辑删除
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    BusinessNotFound:
